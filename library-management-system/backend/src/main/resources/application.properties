# ==============================
# Server Configuration
# ==============================
server.port=8080

# ==============================
# H2 In-Memory Database (default - zero setup, great for demo/dev)
# ==============================
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# MySQL Configuration (uncomment to use MySQL instead of H2)
# ==============================
# spring.datasource.url=jdbc:mysql://localhost:3306/library_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# H2 dialect is auto-detected; for MySQL set: spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Load sample data on startup (works with ddl-auto=update using data.sql defer)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ==============================
# Jackson
# ==============================
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
